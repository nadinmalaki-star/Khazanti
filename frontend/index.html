<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنتي | KHZNTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #0e1a1a; 
            color: #f2ede2; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        header {
            width: 100%;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #c9a961;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 10px rgba(201, 169, 97, 0.3);
        }
        .company-subtitle {
            font-size: 13px;
            color: #c9a961;
            opacity: 0.85;
            font-weight: 500;
        }

        .main-content {
            max-width: 450px;
            width: 100%;
            background: linear-gradient(135deg, #1b3936, #16302d);
            border: 1px solid #274442;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: auto;
        }
        h1 {
            color: #c9a961;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            opacity: 0.85;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #dfc075, #c9a961);
            color: #0e1a1a;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(201, 169, 97, 0.4);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        footer {
            width: 100%;
            padding: 15px 0;
            font-size: 13px;
            opacity: 0.8;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .footer-links {
            display: flex;
            gap: 15px;
        }
        footer button {
            background: none;
            border: none;
            color: #c9a961;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }
        footer button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><span>✨</span> خِزنتي ☁️</a>
        <span class="company-subtitle">من منتجات شركة أثر 🛡️</span>
    </header>

    <div class="main-content">
        <h1>💎 أهلاً بكِ في خِزنتي</h1>
        <p>نظامك الذكي والأكثر أماناً لإدارة المصاريف، الأرصدة، والديون بكفاءة وسهولة تامة عبر السحابة.</p>
        
        <!-- الرابط الصحيح لتطبيق React الحقيقي الذي يحتوي على خانات تسجيل الدخول -->
        <a href="https://khazanti-alpha.vercel.app" class="btn">🚀 تسجيل الدخول / فتح التطبيق</a>
    </div>

    <footer>
        <div class="footer-links">
            <button onclick="alert('شركة أثر - نظام خِزنتي الآمن لإدارة الأموال')">📜 الشروط والأحكام</button>
            <span>•</span>
            <span style="color: #c9a961;">🔐 سياسة الخصوصية</span>
        </div>
        <p>جميع الحقوق محفوظة © 2026 شركة أثر | خِزنتي</p>
    </footer>

</body>
</html>
