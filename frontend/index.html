<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنتي | KHZNTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #0e1a1a; 
            color: #f2ede2; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        /* الهيدر أو اللوغو بالأعلى */
        header {
            width: 100%;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #c9a961;
            text-decoration: none;
        }
        .company-subtitle {
            font-size: 13px;
            color: #f2ede2;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* المحتوى الرئيسي والبطاقة */
        .main-content {
            max-width: 450px;
            width: 100%;
            background: linear-gradient(135deg, #1b3936, #16302d);
            border: 1px solid #274442;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: auto;
        }
        h1 {
            color: #c9a961;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #c9a961;
            color: #0e1a1a;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* الـ Footer والشروط والأحكام بالأسفل */
        footer {
            width: 100%;
            padding: 15px 0;
            font-size: 13px;
            opacity: 0.7;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .footer-links {
            display: flex;
            gap: 15px;
        }
        footer a {
            color: #c9a961;
            text-decoration: none;
            transition: 0.2s;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- اللوغو واسم الشركة في الأعلى -->
    <header>
        <a href="#" class="logo">خِزنتي ☁️</a>
        <span class="company-subtitle">من منتجات شركة أثر</span>
    </header>

    <!-- المحتوى الرئيسي وزر التوجيه للتطبيق الحقيقي -->
    <div class="main-content">
        <h1>أهلاً بكِ في خِزنتي</h1>
        <p>نظامك الذكي لإدارة المصاريف، الأرصدة، والديون بكفاءة وسهولة تامة عبر السحابة.</p>
        
        <!-- زر التوجيه لتطبيق الـ React الفعلي على Vercel -->
        <a href="https://khazanti-git-main-my-projects-da5c.vercel.app/" class="btn">تسجيل الدخول / فتح التطبيق 🚀</a>
    </div>

    <!-- الـ Footer والشروط والأحكام في الأسفل -->
    <footer>
        <div class="footer-links">
            <a href="#">الشروط والأحكام</a>
            <span>•</span>
            <a href="#">سياسة الخصوصية</a>
        </div>
        <p>جميع الحقوق محفوظة © 2026 شركة أثر | خِزنتي</p>
    </footer>

</body>
</html>
