<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق خزنتي - لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- لوحة التحكم الشبكية الكاملة -->
    <div class="dashboard-layout">
        
        <!-- البطاقة الأولى: الرصيد المتاح -->
        <div class="khazanti-card">
            <h3>الرصيد المتاح في الخزينة</h3>
            <p class="balance-amount">150,000 JOD</p>
            <button class="update-btn">تحديث البيانات</button>
        </div>

        <!-- البطاقة الثانية: الإيرادات -->
        <div class="khazanti-card" style="border-right-color: #27ae60;">
            <h3>إجمالي الإيرادات</h3>
            <p class="balance-amount balance-income">45,000 JOD</p>
            <button class="update-btn" style="background-color: #27ae60;">عرض التفاصيل</button>
        </div>

        <!-- البطاقة الثالثة: المصروفات -->
        <div class="khazanti-card" style="border-right-color: #c0392b;">
            <h3>إجمالي المصروفات</h3>
            <p class="balance-amount balance-expense">12,000 JOD</p>
            <button class="update-btn" style="background-color: #c0392b;">عرض التفاصيل</button>
        </div>

    </div>

</body>
</html>
